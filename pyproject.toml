[build-system]
requires = ["setuptools>=77", "pybind11>=2.13,<4"]
build-backend = "setuptools.build_meta"

[project]
name = "pycivil3d"
version = "0.1.0"
description = "Headless civil engineering geometry with a native C++ core"
readme = "README.md"
requires-python = ">=3.9"
license-files = ["cpp/vendor/LICENSE-*"]

[tool.setuptools]
package-dir = {"" = "src"}
